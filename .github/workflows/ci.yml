name: DeployProof CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile Solidity contracts
      run: npx hardhat --config hardhat.config.cjs compile

    - name: Run contract unit tests
      run: npx hardhat --config hardhat.config.cjs test

    - name: Build frontend dApp
      run: npm run build
